# set the new prefix
unbind C-b
set -g prefix C-a
bind -n C-a send-prefix

unbind r
bind r source-file ~/.tmux.conf

#split panes using | and -
bind | split-window -h
bind - split-window -v
unbind "'"
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# enable mouse_control
set -g mouse on

# enable vim motions
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-alternative
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle

# List of plugins
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'

# Terminal settings
set -g default-terminal "tmux-256color"

# Rose Pine theme configuration
set -g @rose_pine_variant 'moon' # Options: 'main', 'moon', 'dawn'

# Disable hostname and user info
set -g @rose_pine_host 'off'
set -g @rose_pine_user 'off'

# Configure date/time display
set -g @rose_pine_date_time '%Y-%m-%d %H:%M:%S'

# Window behavior - show only the current running program
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_show_pane_directory 'off'

# Status bar settings
set -g status-right-length 100
set -g status-left-length 100
set -g status-interval 1

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run ~/.tmux/plugins/tpm/tpm


